name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Check the tag matches the app version and a draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" app/quest/build.gradle.kts
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true

      - name: Check versionCode is higher than the previous release's
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null) || exit 0
          new=$(grep -oP 'versionCode = \K\d+' app/quest/build.gradle.kts)
          old=$(git show "$prev:app/quest/build.gradle.kts" | grep -oP 'versionCode = \K\d+')
          if [ "$new" -le "$old" ]; then
            echo "::error::versionCode $new must be higher than $old from $prev; the Meta Horizon Store rejects it otherwise."
            exit 1
          fi

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hotaru.jks"
          ./gradlew :app:quest:assembleRelease \
            "-Photaru.keystore=$RUNNER_TEMP/hotaru.jks" "-Photaru.keystorePassword=$STORE_PASSWORD" \
            "-Photaru.keyAlias=$KEY_ALIAS" "-Photaru.keyPassword=$KEY_PASSWORD"
          mv app/quest/build/outputs/apk/release/quest-release.apk "hotaru-$GITHUB_REF_NAME.apk"

      - name: Attach it to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "hotaru-$GITHUB_REF_NAME.apk" --clobber
