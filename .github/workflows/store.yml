name: Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: Meta Horizon Store release channel to copy the ALPHA build to
        type: choice
        options: [BETA, RC, STORE]
        default: STORE

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  META_APP_ID: '1500675923122825'
  AGE_GROUP: TEENS_AND_ADULTS

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - name: Download the upload utility
        run: |
          # Meta publishes only this unversioned link; log what was fetched
          curl -fsSL -o ovr-platform-util 'https://www.oculus.com/download_app/?id=5159709737372459&access_token=OC%7C5159709737372459%7C'
          chmod +x ovr-platform-util
          ./ovr-platform-util version
          sha256sum ovr-platform-util

      - name: Upload the release APK to the ALPHA channel
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "hotaru-$TAG.apk"
          # headings and bullets only; the utility takes newlines as literal \n
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body | gsub("\r"; "")
            | split("\n") | map(select(test("^(### |- )")) | sub("^### "; "")) | join("\n")')
          ./ovr-platform-util upload-quest-build \
            --app-id "$META_APP_ID" --app-secret "$META_APP_SECRET" \
            --apk "hotaru-$TAG.apk" --channel ALPHA --age-group "$AGE_GROUP" \
            --notes "$notes" --disable-progress-bar --wait-for-postprocessing

      # Meta refuses a second upload of the same versionCode, so later channels get ALPHA's build.
      - name: Copy the ALPHA build to the ${{ inputs.channel }} channel
        if: github.event_name == 'workflow_dispatch'
        env:
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          ./ovr-platform-util set-release-channel-build \
            --app-id "$META_APP_ID" --app-secret "$META_APP_SECRET" --age-group "$AGE_GROUP" \
            --source-channel ALPHA --destination-channel "$CHANNEL"
